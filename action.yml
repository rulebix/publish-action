name: 'Rulebix Publish Action'
description: 'Publish repository metadata to Rulebix Registry on every push'
author: 'Rulebix'

inputs:
  registry_url:
    description: 'Registry API endpoint URL'
    required: false
    default: 'https://nuxt.ineceper.my.id/api/v1/publish'
  retries:
    description: 'Number of retry attempts on failure'
    required: false
    default: '3'

outputs:
  version:
    description: 'Published version (tag or dev-<sha>)'
  package_name:
    description: 'Package name (owner/repo)'

runs:
  using: 'node20'
  main: 'dist/index.js'